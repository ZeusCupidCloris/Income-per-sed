/* @fragment status */
                    <span class="status-label-viewport">
                        <span class="status-label" id="statusLabel" aria-live="polite" data-date-context><span class="status-label-main" id="statusLabelMain" data-date-context>正在读取时间…</span><span class="status-label-detail" id="statusLabelDetail" data-date-context></span></span>
                    </span>
/* @endfragment */

/* @fragment clock */
                    <time
                        class="current-time"
                        id="currentTime"
                        datetime=""
                        role="button"
                        tabindex="0"
                        aria-label="当前时间。鼠标滚轮、触屏横向拖动、快速回溯按钮或左右方向键可回看"
                    >--:--:--</time>
/* @endfragment */
