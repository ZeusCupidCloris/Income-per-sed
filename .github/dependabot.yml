version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "01:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    pull-request-branch-name:
      prefix: maintenance
      template: "{prefix}/{name}"
    commit-message:
      prefix: "chore(deps)"
    groups:
      test-tools:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    pull-request-branch-name:
      prefix: maintenance
      template: "{prefix}/{name}"
    commit-message:
      prefix: "chore(deps)"
    groups:
      ci-actions:
        patterns:
          - "*"
