name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select validation scope
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: node scripts/install-ci-dependencies.mjs npm
        timeout-minutes: 11
      - id: plan
        run: node scripts/quality-scope.mjs plan

  quality-gate:
    name: Quality Gate
    needs: [scope, release-validation, visual-regression, webkit-smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/quality-scope.mjs gate
        env:
          QUALITY_NEEDS: ${{ toJSON(needs) }}

  pages:
    name: Publish verified main
    needs: [quality-gate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  release-validation:
    name: Release validation
    needs: [scope]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: node scripts/install-ci-dependencies.mjs npm
        timeout-minutes: 11
      - run: npm run test:release
      - run: npm run test:widget
      - run: npm run release:prepare
      - run: npm run test:readme
      - run: git diff --exit-code

  visual-regression:
    name: Windows Edge visual regression
    needs: [scope]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: node scripts/install-ci-dependencies.mjs npm
        timeout-minutes: 11
        if: ${{ !contains(fromJSON('["docs","metadata"]'), needs.scope.outputs.scope) }}
      - run: node scripts/quality-scope.mjs run edge ${{ needs.scope.outputs.scope }}
      - name: Upload visual diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  webkit-smoke:
    name: WebKit smoke
    needs: [scope]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: node scripts/install-ci-dependencies.mjs npm
        timeout-minutes: 11
        if: ${{ !contains(fromJSON('["widget","docs","metadata"]'), needs.scope.outputs.scope) }}
      - run: node scripts/install-ci-dependencies.mjs webkit
        timeout-minutes: 15
        if: ${{ !contains(fromJSON('["widget","docs","metadata"]'), needs.scope.outputs.scope) }}
      - run: node scripts/quality-scope.mjs run webkit ${{ needs.scope.outputs.scope }}
      - name: Upload WebKit diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: webkit-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
