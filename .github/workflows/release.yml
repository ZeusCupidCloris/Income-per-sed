name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run checksums
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/releases/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Missing release notes: $notes"
          }
          gh release create $env:GITHUB_REF_NAME `
            'Income-per-sed-Push.html#Push 日常使用版' `
            'Income-per-sed-Develop.html#Develop 开发诊断版' `
            'IncomeWidget.js#Scriptable iPhone 小组件' `
            'docs/Income-per-sed（说明文档）.docx#完整 Word 说明书' `
            'SHA256SUMS.txt#SHA-256 校验值' `
            --title "Income-per-sed $env:GITHUB_REF_NAME" `
            --notes-file $notes `
            --verify-tag `
            --latest
