name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Preserve repository file bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Verify tag belongs to main
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:RELEASE_TAG origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag $env:RELEASE_TAG is not part of main"
          }
      - run: npm run build:push
      - name: Verify generated Push is committed
        shell: pwsh
        run: |
          git diff --exit-code -- Income-per-sed-Push.html
          if ($LASTEXITCODE -ne 0) {
            throw "Push artifact is stale; regenerate and commit it before tagging"
          }
      - run: npm run checksums
      - run: python scripts/validate_release.py --release-tag $env:RELEASE_TAG
      - run: npm test
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/releases/$env:RELEASE_TAG.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Missing release notes: $notes"
          }
          gh release create $env:RELEASE_TAG `
            'Income-per-sed-Push.html#Push 日常使用版' `
            'Income-per-sed-Develop.html#Develop 开发诊断版' `
            'IncomeWidget.js#Scriptable iPhone 小组件' `
            'docs/Income-per-sed（说明文档）.docx#完整 Word 说明书' `
            'SHA256SUMS.txt#SHA-256 校验值' `
            'release-manifest.json#版本与构建清单' `
            --title "Income-per-sed $env:RELEASE_TAG" `
            --notes-file $notes `
            --verify-tag `
            --latest
